name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y rrdtool librrd-dev npm
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set version
      id: set-version
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=${{ github.event.inputs.version }}
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
    
    - name: Run tests
      run: |
        python -m pytest tests/ --tb=short
    
    - name: Cache FreeBSD pkg tool
      id: cache-pkg
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/pkg
        key: freebsd-pkg-2.7.5-${{ runner.os }}
    
    - name: Build FreeBSD pkg tool
      if: steps.cache-pkg.outputs.cache-hit != 'true'
      run: |
        # freebsd/pkg publishes no binaries; it builds natively on Linux
        sudo apt-get install -y build-essential m4 pkg-config zlib1g-dev \
          libssl-dev libbz2-dev liblzma-dev libzstd-dev libarchive-dev \
          libcurl4-openssl-dev libbsd-dev libsqlite3-dev
        git clone --depth 1 -b 2.7.5 https://github.com/freebsd/pkg /tmp/pkgsrc
        cd /tmp/pkgsrc
        ./configure
        make -j"$(nproc)"
        sudo make install
    
    - name: Build package
      run: |
        make clean
        make build
        make package VERSION=${{ env.VERSION }}
    
    - name: Verify package installs
      run: |
        # Install into an empty root with the same tool OPNsense uses;
        # -I skips install scripts (they need FreeBSD), -M ignores the
        # python/rrdtool dependencies that only exist on the target box.
        mkdir -p /tmp/pkgroot
        pkg -r /tmp/pkgroot add -IM dist/os-hilink-${{ env.VERSION }}.pkg
        test -f /tmp/pkgroot/usr/local/opnsense/scripts/hilink/hilink_service.py
        test -f /tmp/pkgroot/usr/local/opnsense/mvc/app/models/OPNsense/HiLink/HiLink.xml
        test -f /tmp/pkgroot/usr/local/opnsense/service/conf/actions.d/actions_hilink.conf
        pkg -r /tmp/pkgroot info os-hilink
        echo "package verified"
    
    - name: Generate checksums
      run: |
        cd dist
        sha256sum *.pkg > checksums.sha256
        md5sum *.pkg > checksums.md5
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hilink-plugin-${{ env.VERSION }}
        path: |
          dist/*.pkg
          dist/checksums.*
    
    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.pkg
          dist/checksums.*
        generate_release_notes: true
        body: |
          ## HiLink Plugin Release ${{ env.VERSION }}
          
          ### Installation Methods
          
          #### Method 1: Via Package Repository (Recommended)
          ```bash
          # Add repository
          fetch -o /usr/local/etc/pkg/repos/HiLink.conf \
            https://${{ github.repository_owner }}.github.io/opnsense-hilink-plugin/HiLink.conf
          
          # Install plugin
          pkg update && pkg install os-hilink
          ```
          
          #### Method 2: Direct Download
          1. Download the `os-hilink-${{ env.VERSION }}.pkg` file below
          2. Copy it to your OPNsense box and run `pkg add os-hilink-${{ env.VERSION }}.pkg`
          3. Navigate to Services → HiLink to configure

          #### Method 3: Command Line
          ```bash
          pkg add https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/os-hilink-${{ env.VERSION }}.pkg
          ```
          
          ### Package Repository
          🌐 **Repository URL**: https://${{ github.repository_owner }}.github.io/opnsense-hilink-plugin/
          
          ### Checksums
          - SHA256: See `checksums.sha256`
          - MD5: See `checksums.md5`
          
          ### Changelog
          See below for auto-generated release notes

  documentation:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install sphinx sphinx-rtd-theme
    
    - name: Build documentation
      run: |
        cd docs
        # Create Sphinx configuration if needed
        cat > conf.py << 'EOF'
        project = 'HiLink OPNsense Plugin'
        copyright = '2024, HiLink Plugin Team'
        author = 'HiLink Plugin Team'
        release = '${{ needs.build.outputs.version }}'
        extensions = ['sphinx.ext.autodoc', 'sphinx.ext.napoleon']
        html_theme = 'sphinx_rtd_theme'
        EOF
        
        # Build HTML docs
        sphinx-build -b html . _build/html || true
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        destination_dir: ${{ needs.build.outputs.version }}

  notify:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    
    steps:
    - name: Send notification
      run: |
        if [ "${{ needs.build.result }}" = "success" ]; then
          echo "✅ Build successful for version ${{ needs.build.outputs.version }}"
        else
          echo "❌ Build failed for version ${{ needs.build.outputs.version }}"
        fi
