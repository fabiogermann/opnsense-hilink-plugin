[start]
command:/usr/sbin/daemon -f -p /var/run/hilink.pid /usr/local/opnsense/scripts/hilink/hilink_service.py --foreground --config /usr/local/etc/hilink
parameters:
type:script
message:Starting HiLink service
description:Start HiLink modem monitoring service

[stop]
command:/bin/pkill -F /var/run/hilink.pid 2>/dev/null; /bin/rm -f /var/run/hilink.pid; exit 0
parameters:
type:script
message:Stopping HiLink service
description:Stop HiLink modem monitoring service

[restart]
command:/bin/pkill -F /var/run/hilink.pid 2>/dev/null; /bin/rm -f /var/run/hilink.pid; sleep 2; /usr/sbin/daemon -f -p /var/run/hilink.pid /usr/local/opnsense/scripts/hilink/hilink_service.py --foreground --config /usr/local/etc/hilink
parameters:
type:script
message:Restarting HiLink service
description:Restart HiLink modem monitoring service

[status]
command:if /bin/pgrep -qF /var/run/hilink.pid 2>/dev/null; then echo running; else echo stopped; fi
parameters:
type:script_output
message:Checking HiLink service status

[connect]
command:/usr/local/opnsense/scripts/hilink/hilink_control.py connect %s
parameters:%s
type:script
message:Connecting modem %s

[disconnect]
command:/usr/local/opnsense/scripts/hilink/hilink_control.py disconnect %s
parameters:%s
type:script
message:Disconnecting modem %s

[reboot]
command:/usr/local/opnsense/scripts/hilink/hilink_control.py reboot %s
parameters:%s
type:script
message:Rebooting modem %s

[getstatus]
command:/usr/local/opnsense/scripts/hilink/hilink_control.py status %s
parameters:%s
type:script_output
message:Getting modem status

[getmetrics]
command:/usr/local/opnsense/scripts/hilink/hilink_control.py metrics %s
parameters:%s
type:script_output
message:Getting modem metrics

[probe]
command:/usr/local/opnsense/scripts/hilink/hilink_control.py probe %s
parameters:%s
type:script_output
message:Reading settings from modem

[test]
command:/usr/local/opnsense/scripts/hilink/hilink_control.py test
parameters:
type:script_output
message:Testing HiLink configuration
